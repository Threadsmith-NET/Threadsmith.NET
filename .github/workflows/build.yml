# Threadsmith.NET CI (plan-01 task 9).
# Restore + build + test on Windows, Linux, and macOS. All completed milestone suites run
# with the architecture-direction tests as the dependency correctness gate.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record test environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults/ci | Out-Null
          git rev-parse HEAD | Set-Content TestResults/ci/revision.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --info | Set-Content TestResults/ci/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet msbuild tests/Threadsmith.ParallelAgents.Tests/Threadsmith.ParallelAgents.Tests.csproj -getProperty:ContinuousIntegrationBuild,Configuration,TargetFramework,Deterministic | Set-Content TestResults/ci/build-properties.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged documentation
        shell: pwsh
        run: ./eng/release/Test-SourceDocumentation.ps1

      - name: Verify PR submission gate
        shell: pwsh
        run: ./eng/Test-PrSubmission.ps1

      - name: Restore
        run: dotnet restore src/Threadsmith.sln

      - name: Stage pinned ripgrep for integration tests
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'threadsmith-test-ripgrep'
          ./eng/Stage-DevelopmentRipgrep.ps1 -OutputRoot $outputRoot
          $executable = Join-Path $outputRoot ('stage/tools/rg' + $(if ($IsWindows) { '.exe' } else { '' }))
          & $executable --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "THREADSMITH_TEST_RIPGREP=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: dotnet build src/Threadsmith.sln --configuration Debug --no-restore

      - name: Test
        shell: pwsh
        run: |
          $parallelModules = if ($env:RUNNER_OS -eq 'macOS') { 1 } else { 4 }
          $resultsDirectory = Join-Path $PWD "TestResults/run-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath $resultsDirectory) { throw "Test evidence directory must be fresh: $resultsDirectory" }
          dotnet test --solution src/Threadsmith.sln --configuration Debug --no-build --max-parallel-test-modules $parallelModules --list-tests | Tee-Object TestResults/ci/discovered-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # xUnit's timestamp-based report names can collide across parallel modules.
          # Give each solution test project its own evidence directory, retaining parallel execution.
          $solutionProjects = @(dotnet sln src/Threadsmith.sln list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testProjects = @($solutionProjects | Where-Object { $_ -match '\.Tests\.csproj$' } | ForEach-Object {
            (Resolve-Path (Join-Path "$PWD/src" ($_ -replace '\\', '/'))).Path
          })
          if ($testProjects.Count -eq 0) { throw 'No test projects found in the solution.' }
          $outcomes = @($testProjects | ForEach-Object -Parallel {
            $ErrorActionPreference = 'Stop'
            $project = $_
            $moduleResults = Join-Path $using:resultsDirectory ([IO.Path]::GetFileNameWithoutExtension($project))
            New-Item -ItemType Directory $moduleResults | Out-Null
            dotnet test --project $project --configuration Debug --no-build --report-xunit --report-xunit-filename results.xunit --report-ctrf --report-ctrf-filename results.ctrf --results-directory $moduleResults --diagnostic --diagnostic-verbosity Warning --output Detailed | Tee-Object (Join-Path $moduleResults 'test.log') | Out-Host
            [pscustomobject]@{ Project = $project; ExitCode = $LASTEXITCODE }
          } -ThrottleLimit $parallelModules)
          if ($outcomes.Count -ne $testProjects.Count) { throw 'Not all test projects returned an outcome.' }
          $failedProjects = @($outcomes | Where-Object ExitCode -ne 0)
          if ($failedProjects.Count -gt 0) { throw "Test projects failed: $($failedProjects.Project -join ', ')" }

      - name: Verify required platform cases executed
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./eng/Test-CiRequiredCases.ps1 -RunnerOS $env:RUNNER_OS -ResultsDirectory "TestResults/run-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"

      - name: Report macOS native test crashes
        if: ${{ failure() && runner.os == 'macOS' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          decoder = json.JSONDecoder()
          artifact_root = Path("TestResults/ci/native-crashes")
          artifact_root.mkdir(parents=True, exist_ok=True)
          report_roots = [
              Path.home() / "Library/Logs/DiagnosticReports",
              Path("/Library/Logs/DiagnosticReports"),
          ]
          count = 0
          for root in report_roots:
              for path in sorted(root.glob("*.ips")):
                  if not any(name in path.name.lower() for name in ("dotnet", "threadsmith", "testhost")):
                      continue
                  try:
                      shutil.copy2(path, artifact_root / f"{count}-{path.name}")
                      raw = path.read_text()
                      header, offset = decoder.raw_decode(raw)
                      report = json.loads(raw[offset:].strip()) if raw[offset:].strip() else header
                      threads = report.get("threads", [])
                      index = report.get("faultingThread", -1)
                      frames = threads[index].get("frames", []) if 0 <= index < len(threads) else []
                      images = report.get("usedImages", [])
                      print(json.dumps({
                          "report": path.name,
                          "process": report.get("procName"),
                          "exception": report.get("exception"),
                          "termination": report.get("termination"),
                          "faultingFrames": frames,
                          "images": [{"name": image.get("name"), "base": image.get("base")} for image in images],
                      }, indent=2))
                      count += 1
                  except (OSError, ValueError, TypeError) as error:
                      print(f"Could not read {path.name}: {error}")
          print(f"Native crash reports found: {count}")
          PY

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            TestResults/**
            tests/**/TestResults/**
          if-no-files-found: warn
