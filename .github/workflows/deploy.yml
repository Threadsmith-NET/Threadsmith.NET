name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/threadsmith-pages"
          cp -a docs/. "$RUNNER_TEMP/threadsmith-pages/"
          cp index.html google*.html .nojekyll "$RUNNER_TEMP/threadsmith-pages/"
          cp -a website-assets "$RUNNER_TEMP/threadsmith-pages/"
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/threadsmith-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
