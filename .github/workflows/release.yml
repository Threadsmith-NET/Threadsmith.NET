name: release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run version, e.g. 0.1.1-beta1 or v0.1.1-beta1 (no release upload)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          . ./eng/release/Release.Common.ps1
          $version = Resolve-ReleaseWorkflowVersion -EventName $env:GITHUB_EVENT_NAME -RequestedVersion $env:REQUESTED_VERSION -RefName $env:GITHUB_REF_NAME -RefType $env:GITHUB_REF_TYPE
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify release contracts
        shell: pwsh
        run: ./eng/release/Test-ReleaseContracts.ps1

  package:
    needs: contracts
    env:
      RELEASE_VERSION: ${{ needs.contracts.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            script: Build-WindowsInstaller.ps1
          - rid: win-arm64
            os: windows-latest
            script: Build-WindowsInstaller.ps1
          - rid: linux-x64
            os: ubuntu-latest
            script: Build-LinuxArchive.ps1
          - rid: linux-arm64
            os: ubuntu-latest
            script: Build-LinuxArchive.ps1
          - rid: osx-x64
            os: macos-15-intel
            script: Build-MacPackage.ps1
          - rid: osx-arm64
            os: macos-15
            script: Build-MacPackage.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Windows packaging tools
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./eng/release/Install-WindowsPackagingTools.ps1 -InstallDirectory '${{ runner.temp }}/threadsmith-windows-packaging-tools'
      - name: Build platform artifact
        shell: pwsh
        run: ./eng/release/${{ matrix.script }} -Version $env:RELEASE_VERSION -RuntimeIdentifier '${{ matrix.rid }}' -OutputRoot '${{ runner.temp }}/threadsmith-release'
      - name: Reject secret canary leakage
        shell: pwsh
        env:
          THREADSMITH_RELEASE_SECRET_CANARY: ${{ secrets.THREADSMITH_RELEASE_SECRET_CANARY }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:THREADSMITH_RELEASE_SECRET_CANARY)) {
            Get-ChildItem '${{ runner.temp }}/threadsmith-release/artifacts' -File | ForEach-Object {
              $content = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($_.FullName))
              if ($content.Contains($env:THREADSMITH_RELEASE_SECRET_CANARY, [StringComparison]::Ordinal)) {
                throw "Secret canary detected in $($_.Name)."
              }
            }
          }
      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: ${{ runner.temp }}/threadsmith-release/artifacts/*
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [contracts, package]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.contracts.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Verify aggregate release
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          ./eng/release/New-ReleaseManifest.ps1 -Version $version -ReleaseTag "v$version" -SourceCommit '${{ github.sha }}' -ArtifactDirectory artifacts
      - name: Upload verified aggregate
        uses: actions/upload-artifact@v4
        with:
          name: release-aggregate
          path: |
            artifacts/release-manifest.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-aggregate
          path: artifacts
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --verify-tag --generate-notes --title "Threadsmith.NET ${{ github.ref_name }}"
